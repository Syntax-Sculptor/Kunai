name: Bundle Lua Scripts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: python tools/build.py
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Palette Standalone
          path: dist/palette.lua
          if-no-files-found: error